<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"><style>
:root{color-scheme:light;--bg:#fff;--surface:#f0eee6;--text:#1f1e1b;--secondary:#6b6a63;--border:#e5e2d9;--accent:#c96442;--danger:#c64e45;--warning:#b78033}
:root[data-mode=dark]{color-scheme:dark;--bg:#282724;--surface:#34332f;--text:#eeeae2;--secondary:#b5b1a7;--border:#45433d;--accent:#e18b6b;--danger:#ed8b80;--warning:#d2ad6b}
*{box-sizing:border-box}html{height:100%;overflow:hidden}body{margin:0;height:100%;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}button{appearance:none;font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;margin:0;box-shadow:none}button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}header{padding:7px 8px 7px 11px;border-bottom:1px solid color-mix(in srgb,var(--border) 65%,transparent);cursor:grab;user-select:none}.bar{display:flex;align-items:center;gap:5px;min-height:24px}.mark{display:flex;align-items:center;color:var(--accent);margin-right:1px}.title{font-size:12px;font-weight:600;white-space:nowrap}#count{flex:1;font-size:10px;color:var(--secondary);font-variant-numeric:tabular-nums;white-space:nowrap}.tool{display:grid;place-items:center;width:24px;height:24px;padding:0;border-radius:5px;color:var(--secondary);flex-shrink:0}.tool:hover{background:var(--surface);color:var(--text)}.tool:active{background:color-mix(in srgb,var(--border) 70%,var(--bg))}#summary{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}main{padding:5px 10px 7px;display:flex;flex-direction:column;gap:0;max-height:calc(100vh - 41px);overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.group{padding:4px 0;flex-shrink:0}.group+.group{border-top:1px solid color-mix(in srgb,var(--border) 65%,transparent)}.head{display:flex;align-items:center;gap:6px;padding:0 2px;min-height:28px}.name{display:block;flex:1;min-width:0;min-height:26px;text-align:left;padding:3px 2px;border-radius:4px;line-height:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.head .name{font-weight:500}.name:hover{background:var(--surface);color:var(--text)}.priority{flex-shrink:0;font-size:9px;line-height:16px;padding:0 4px;border-radius:4px;color:var(--secondary)}.priority.p0{color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--bg))}.priority.p1{color:var(--warning)}.children{margin:0 2px 2px 8px;border-left:1px solid var(--border);padding-left:9px}.row{display:flex;align-items:center;gap:6px;min-height:27px}.row .name{font-size:12px;font-weight:400;color:var(--secondary)}.progress{flex-shrink:0;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:var(--secondary);font-variant-numeric:tabular-nums}.empty{text-align:center;padding:18px 6px;color:var(--secondary);font-size:12px}
</style></head><body>
<header id="drag"><div class="bar"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span><span class="title" id="title">今日聚焦</span><span id="count"></span><button class="tool" title="返回 DSH" aria-label="返回 DSH" id="return"><svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg></button><button class="tool" title="收成悬浮球" aria-label="收成悬浮球" id="collapse"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button class="tool" title="关闭系统悬浮窗" aria-label="关闭系统悬浮窗" id="close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="summary"></div></header><main id="groups" aria-label="未完成聚焦任务"></main>
<script>
const send = value => window.webkit?.messageHandlers.focus.postMessage(value);
const el = (tag, cls, text) => {const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const taskButton = (name, taskId, subtaskId) => {const b=el('button','name',name);b.title=name;b.onclick=()=>send({type:'task',taskId,subtaskId});return b;};
const paletteKeys=['bg','surface','text','secondary','border','accent','danger','warning'];
window.applySnapshot = data => {
 document.documentElement.dataset.mode=data.mode;
 for(const key of paletteKeys){const color=data.palette?.[key];if(typeof color==='string'&&CSS.supports('color',color))document.documentElement.style.setProperty('--'+key,color);else document.documentElement.style.removeProperty('--'+key);}
 document.getElementById('title').textContent=data.title;document.getElementById('count').textContent=data.count;document.getElementById('summary').textContent=data.summary;
 const list=document.getElementById('groups');const top=list.scrollTop;list.replaceChildren();
 if(!data.groups.length)list.append(el('div','empty',data.empty));
 for(const g of data.groups){const section=el('section','group');section.setAttribute('aria-label',g.name);const head=el('div','head');head.append(taskButton(g.name,g.taskId));head.append(el('span','priority '+g.priority.toLowerCase(),g.priority));section.append(head);
 if(g.children.length){const children=el('div','children');for(const c of g.children){const row=el('div','row');row.append(taskButton(c.name,g.taskId,c.id));if(c.progress)row.append(el('span','progress',c.progress));children.append(row)}section.append(children)}list.append(section)}list.scrollTop=top;
 requestAnimationFrame(()=>send({type:'size',height:document.querySelector('header').offsetHeight+Math.min(list.scrollHeight,318)+2}));
};
document.getElementById('collapse').onclick=()=>send({type:'compact',value:true});
document.getElementById('close').onclick=()=>send({type:'close'});
document.getElementById('return').onclick=()=>send({type:'return'});
</script></body></html>
